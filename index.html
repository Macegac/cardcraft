<meta charset="utf-8">
<title>Cardcraft</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#131614">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cardcraft">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#edefec; --panel:#ffffff; --sunk:#e3e6e2;
  --ink:#1a1d1a; --ink-dim:#5c635c; --ink-faint:#8b928b;
  --rule:#d5dad4; --rule-soft:#e6e9e5;
  --accent:#9c5518; --accent-ink:#ffffff; --accent-soft:#f2e3d6;
  --ok:#2c6b41; --warn:#8a5a00; --danger:#a8322a;
  --shadow:0 1px 2px rgba(26,29,26,.06),0 4px 12px rgba(26,29,26,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#131614; --panel:#1c201e; --sunk:#171a18;
    --ink:#e7eae6; --ink-dim:#98a09a; --ink-faint:#6e766f;
    --rule:#2c322e; --rule-soft:#242926;
    --accent:#d98b45; --accent-ink:#131614; --accent-soft:#2e2419;
    --ok:#5fb87f; --warn:#d9a445; --danger:#e8756a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --ground:#131614; --panel:#1c201e; --sunk:#171a18;
  --ink:#e7eae6; --ink-dim:#98a09a; --ink-faint:#6e766f;
  --rule:#2c322e; --rule-soft:#242926;
  --accent:#d98b45; --accent-ink:#131614; --accent-soft:#2e2419;
  --ok:#5fb87f; --warn:#d9a445; --danger:#e8756a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.5; overscroll-behavior-y:none;
}
button,input,textarea,select{font:inherit;color:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}

/* ---------- chrome ---------- */
.topbar{
  position:sticky; top:0; z-index:40; background:var(--panel);
  border-bottom:1px solid var(--rule);
  padding:max(10px,env(safe-area-inset-top)) 12px 10px;
  display:flex; align-items:center; gap:10px;
}
.topbar h1{
  font-size:1rem; font-weight:600; margin:0; flex:1; min-width:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.iconbtn{
  background:none; border:1px solid var(--rule); border-radius:7px;
  padding:7px 11px; cursor:pointer; font-size:.8rem; font-weight:500;
  white-space:nowrap; color:var(--ink-dim);
}
.iconbtn:active{background:var(--sunk)}
.iconbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.iconbtn.sq{padding:7px 9px;font-size:.95rem;line-height:1}
.iconbtn:disabled{opacity:.32}
.fieldbtns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.minibtn{
  background:none;color:var(--ink-faint);border:1px solid var(--rule);border-radius:5px;
  padding:4px 9px;font-size:.66rem;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;cursor:pointer;
}
.minibtn:active{background:var(--sunk)}
.minibtn:disabled{opacity:.3;cursor:default}
.minibtn.revert{color:var(--warn);border-color:var(--warn)}
.spacer{flex:1}
.genrow{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--rule-soft)}
.genrow:last-of-type{border-bottom:0}
.genrow input[type=checkbox]{width:19px;height:19px;flex:none;accent-color:var(--accent)}
.genrow .gl{flex:1;min-width:0}
.genrow .gn{font-size:.83rem;font-weight:600}
.genrow .gv{font-size:.75rem;color:var(--ink-dim);display:-webkit-box;-webkit-line-clamp:2;
            -webkit-box-orient:vertical;overflow:hidden}
.iconbtn:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.tabs{
  position:sticky; top:0; z-index:35; display:flex; background:var(--panel);
  border-bottom:1px solid var(--rule); overflow-x:auto; scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  background:none;border:0;border-bottom:2px solid transparent; cursor:pointer;
  padding:11px 15px; font-size:.85rem; font-weight:500; color:var(--ink-dim);
  white-space:nowrap;
}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

main{padding:16px 12px calc(28px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.view[hidden]{display:none}

/* ---------- library ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.cardtile{
  background:var(--panel); border:1px solid var(--rule); border-radius:10px;
  overflow:hidden; cursor:pointer; text-align:left; padding:0; box-shadow:var(--shadow);
  display:flex; flex-direction:column;
}
.cardtile:active{transform:scale(.985)}
.cardtile img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:var(--sunk)}
.cardtile .meta{padding:9px 10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cardtile .nm{font-weight:600;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cardtile .sub{font-size:.68rem;color:var(--ink-faint);letter-spacing:.04em;text-transform:uppercase}
.empty{
  border:1px dashed var(--rule); border-radius:10px; padding:36px 20px;
  text-align:center; color:var(--ink-dim); font-size:.9rem;
}
.empty p{margin:0 0 6px}

/* ---------- library view switch ---------- */
.libbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.seg{display:flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden;flex:none}
.segbtn{
  background:var(--panel);border:0;color:var(--ink-dim);cursor:pointer;
  padding:6px 13px;font-size:.76rem;font-weight:600;letter-spacing:.03em;
}
.segbtn + .segbtn{border-left:1px solid var(--rule)}
.segbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.segbtn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* ---------- library rows ---------- */
.cardtile{position:relative}
.tileopen{
  background:none;border:0;padding:0;width:100%;cursor:pointer;text-align:left;
  display:flex;flex-direction:column;color:inherit;
}
.morebtn{
  background:var(--panel);border:1px solid var(--rule);border-radius:6px;color:var(--ink-dim);
  cursor:pointer;padding:2px 9px 5px;font-size:1rem;line-height:1;flex:none;
}
.morebtn.tile{position:absolute;top:7px;right:7px;opacity:.94}
.morebtn:active{background:var(--sunk)}
.morebtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.cardlist{display:flex;flex-direction:column;gap:7px}
.listrow{
  display:flex;align-items:center;gap:9px;background:var(--panel);
  border:1px solid var(--rule);border-radius:9px;padding:10px 11px;
}
.listmain{
  flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;
  cursor:pointer;color:inherit;display:flex;flex-direction:column;gap:3px;
}
.listrow .nm{font-weight:600;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.listrow .sub{font-size:.68rem;color:var(--ink-faint);letter-spacing:.04em;text-transform:uppercase}
.listmain:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- fields ---------- */
.field{
  background:var(--panel); border:1px solid var(--rule); border-radius:9px;
  padding:11px 12px; margin-bottom:10px; display:flex; flex-direction:column; gap:7px;
}
.field > .head{display:flex;align-items:center;gap:8px}
.field label{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:.67rem; font-weight:600;
  letter-spacing:.1em; text-transform:uppercase; color:var(--ink-dim); flex:1;
}
.tok{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:.65rem;
  color:var(--ink-faint); font-variant-numeric:tabular-nums; white-space:nowrap;
}
.field > .head .tok{flex:none}
.tok.wrap{white-space:normal;line-height:1.5}
.aibtn{
  background:var(--accent-soft); color:var(--accent); border:0; border-radius:5px;
  padding:4px 9px; font-size:.66rem; font-weight:700; letter-spacing:.07em;
  text-transform:uppercase; cursor:pointer;
}
.aibtn:disabled{opacity:.35;cursor:default}
input[type=text],textarea,select{
  width:100%; background:var(--sunk); border:1px solid var(--rule-soft);
  border-radius:6px; padding:9px 10px; font-size:.92rem; resize:vertical;
}
textarea{min-height:76px;line-height:1.55}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.row{display:flex;gap:10px}
.row > *{flex:1;min-width:0}

.portrait{display:flex;gap:13px;align-items:flex-start}
.portrait img{
  width:98px;aspect-ratio:2/3;object-fit:cover;border-radius:7px;
  border:1px solid var(--rule);background:var(--sunk);flex:none;
}
.portrait .side{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0}

.listitem{
  background:var(--panel);border:1px solid var(--rule);border-radius:9px;
  padding:11px 12px;margin-bottom:9px;display:flex;flex-direction:column;gap:7px;
}
.listitem .bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.listitem .bar .idx{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.66rem;font-weight:600;
  color:var(--ink-faint);letter-spacing:.08em;flex:1;text-transform:uppercase;
  min-width:4.4em;
}
.listitem .bar .minibtn{padding:4px 10px;font-size:.72rem;line-height:1.1}
.del{background:none;border:0;color:var(--danger);cursor:pointer;font-size:.7rem;font-weight:600;
     text-transform:uppercase;letter-spacing:.06em;padding:3px 5px}

details.rec{background:var(--panel);border:1px solid var(--rule);border-radius:9px;margin-bottom:8px}
details.rec > summary{padding:11px 12px;cursor:pointer;font-weight:600;font-size:.88rem;list-style:none}
details.rec > summary::-webkit-details-marker{display:none}
details.rec > summary::before{content:"▸ ";color:var(--accent)}
details.rec[open] > summary::before{content:"▾ "}
details.rec .body{padding:0 12px 12px;border-top:1px solid var(--rule-soft);margin-top:2px;padding-top:10px}
.kv{display:grid;grid-template-columns:minmax(90px,auto) 1fr;gap:5px 12px;font-size:.8rem}
.kv dt{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.7rem;color:var(--ink-faint);
       text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.kv dd{margin:0;word-break:break-word}

.note{
  border:1px solid var(--rule); border-left:3px solid var(--warn); background:var(--panel);
  border-radius:7px; padding:11px 12px; font-size:.83rem; color:var(--ink-dim); margin-bottom:12px;
}
.note b{color:var(--ink)}
h2.sec{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:.68rem; font-weight:600;
  letter-spacing:.13em; text-transform:uppercase; color:var(--ink-dim);
  margin:22px 0 9px; padding-bottom:7px; border-bottom:1px solid var(--rule);
}
h2.sec:first-child{margin-top:0}
h2.sec.withbtn{display:flex;align-items:center;gap:9px}
h2.sec.withbtn .minibtn{margin-left:auto}

/* ---------- tappable field preview (long text is edited in a sheet) ---------- */
.preview{
  background:var(--sunk); border:1px solid var(--rule-soft); border-radius:6px;
  padding:10px 11px; font-size:.9rem; line-height:1.5; cursor:pointer;
  white-space:pre-wrap; word-break:break-word; max-height:7.6em; overflow:hidden;
  position:relative;
}
.preview::after{
  content:''; position:absolute; left:0; right:0; bottom:0; height:2.1em;
  background:linear-gradient(to bottom, transparent, var(--sunk));
  pointer-events:none;
}
.preview.placeholder{color:var(--ink-faint);font-style:italic}
.preview.placeholder::after{display:none}
.preview:active{border-color:var(--accent)}
.preview:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- prompt override button ---------- */
.minibtn.prompt{text-transform:none;letter-spacing:.02em}
.minibtn.prompt.on{color:var(--accent);border-color:var(--accent)}
.minibtn.promote{color:var(--accent);border-color:var(--accent)}

/* ---------- drag handle ---------- */
.grip{
  background:none;border:1px solid var(--rule);border-radius:5px;color:var(--ink-faint);
  padding:3px 8px;font-size:.95rem;line-height:1;cursor:grab;flex:none;
  touch-action:none; user-select:none;
}
.grip:active{cursor:grabbing;background:var(--sunk)}
.listitem.dragging{opacity:.9;border-color:var(--accent);box-shadow:var(--shadow);transform:scale(1.01)}
body.dragging{user-select:none;cursor:grabbing}
body.dragging .greetlist textarea{pointer-events:none}
.greetlist{display:flex;flex-direction:column}

/* ---------- sheet variants ---------- */
.sheet.tall{height:88vh}
.sheethead{display:flex;align-items:baseline;gap:9px}
.sheethead h3{flex:1;min-width:0}
textarea.editor{
  flex:1; min-height:44vh; resize:none; font-size:.95rem; line-height:1.6;
  background:var(--panel);
}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,12,10,.5);z-index:50;display:flex;align-items:flex-end}
.scrim[hidden]{display:none}
.sheet{
  background:var(--ground); width:100%; max-height:88vh; overflow-y:auto;
  border-radius:14px 14px 0 0; padding:18px 14px calc(20px + env(safe-area-inset-bottom));
  max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:12px;
}
.sheet h3{margin:0;font-size:1.05rem;font-weight:600}
.sheet .desc{margin:0;font-size:.85rem;color:var(--ink-dim)}
.diff{display:flex;flex-direction:column;gap:9px}
.diffbox{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:11px}
.diffbox .cap{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.63rem;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px;
}
.diffbox.new{border-left:3px solid var(--ok)}
.diffbox .txt{font-size:.87rem;white-space:pre-wrap;word-break:break-word;max-height:34vh;overflow-y:auto}
.diffbox.old{border-left:3px solid var(--danger)}

/* ---------- smart edit review ---------- */
.smartrow{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--rule-soft)}
.smartrow:last-child{border-bottom:0}
.smartrow input[type=checkbox]{width:19px;height:19px;flex:none;accent-color:var(--accent);margin-top:1px}
.smartrow .sb{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.smartrow .sn{font-size:.83rem;font-weight:600}
.smartrow .sw{font-size:.78rem;color:var(--ink-dim)}
.smartrow .diffbox{padding:8px 10px}
.smartrow .diffbox .txt{font-size:.82rem;max-height:24vh}
.smartrow.off{opacity:.55}
.smartrow.off .sw{color:var(--danger)}
.sheetbtns{display:flex;gap:9px}
.sheetbtns .iconbtn{flex:1;text-align:center;padding:12px}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--accent);
      border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}.cardtile:active{transform:none}}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));
  background:var(--ink);color:var(--ground);padding:11px 17px;border-radius:8px;
  font-size:.85rem;font-weight:500;z-index:60;max-width:88vw;text-align:center;box-shadow:var(--shadow);
}
.toast[hidden]{display:none}
</style>

<div class="topbar">
  <button class="iconbtn" id="back" hidden>Library</button>
  <h1 id="title">Cardcraft</h1>
  <button class="iconbtn sq" id="undoBtn" title="Undo" aria-label="Undo" hidden disabled>↶</button>
  <button class="iconbtn sq" id="redoBtn" title="Redo" aria-label="Redo" hidden disabled>↷</button>
  <button class="iconbtn" id="installBtn" hidden>Install</button>
  <button class="iconbtn sq" id="settingsBtn" title="Settings" aria-label="Settings">⚙</button>
  <button class="iconbtn" id="newBtn">+ New</button>
  <button class="iconbtn primary" id="importBtn">Import</button>
</div>
<input type="file" id="fileIn" accept="image/png,.png,.json" multiple hidden>

<nav class="tabs" id="tabs" hidden>
  <button class="tab" data-tab="card"  aria-selected="true">Card</button>
  <button class="tab" data-tab="lore"  aria-selected="false">Lorebook</button>
  <button class="tab" data-tab="rec"   aria-selected="false">Recipes</button>
  <button class="tab" data-tab="out"   aria-selected="false">Export</button>
</nav>

<main>
  <section class="view" id="v-library"></section>
  <section class="view" id="v-card"  hidden></section>
  <section class="view" id="v-lore"  hidden></section>
  <section class="view" id="v-rec"   hidden></section>
  <section class="view" id="v-out"   hidden></section>
</main>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";

/* ============================ utilities ============================ */
const $ = id => document.getElementById(id);
const el = (tag, cls, txt) => { const n = document.createElement(tag);
  if(cls) n.className = cls; if(txt != null) n.textContent = txt; return n; };
const esc = s => String(s == null ? '' : s);
let toastTimer;
function toast(msg, ms){
  const t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, ms || 2600);
}
// Rough token estimate. Swapped for llama-tokenizer-js in a later phase.
const estTokens = s => s ? Math.ceil(s.length / 3.6) : 0;
const clone = o => JSON.parse(JSON.stringify(o));

/* ============================ undo / redo ============================
   Snapshot-based, matching the desktop app's 80-step depth. Typing is
   coalesced so a sentence is one undo step, not forty; discrete actions
   (clear, revert, AI accept, add/remove) commit immediately. */
const UNDO_DEPTH = 80;
const Hist = {
  stack:[], i:-1, timer:null, pending:null,

  reset(data){ this.stack = [clone(data)]; this.i = 0; this.pending = null;
    clearTimeout(this.timer); this.paint(); },

  /* label is shown in the toast on undo, so make it read like the action */
  commit(label){
    clearTimeout(this.timer); this.pending = null;
    if(!CURRENT) return;
    const snap = clone(CURRENT.data);
    if(JSON.stringify(snap) === JSON.stringify(this.stack[this.i])) return;
    this.stack.length = this.i + 1;
    this.stack.push(snap);
    this.labels = this.labels || {};
    this.labels[this.stack.length - 1] = label || 'edit';
    if(this.stack.length > UNDO_DEPTH){ this.stack.shift(); }
    else this.i++;
    if(this.i > this.stack.length - 1) this.i = this.stack.length - 1;
    this.paint();
  },

  /* typing: fold rapid keystrokes into one step */
  coalesce(label){
    this.pending = label;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.commit(this.pending), 700);
  },

  can(dir){ return dir < 0 ? this.i > 0 : this.i < this.stack.length - 1; },

  go(dir){
    if(this.pending){ this.commit(this.pending); }        // flush a half-typed step first
    if(!this.can(dir)) return;
    this.i += dir;
    CURRENT.data = clone(this.stack[this.i]);
    this.paint();
    queueSave();
    if(CURRENT) $('title').textContent = CURRENT.data.name || 'Untitled';
    selectTab(TAB);
    toast(dir < 0 ? 'Undone' : 'Redone', 1200);
  },

  paint(){
    const u = $('undoBtn'), r = $('redoBtn');
    if(!u || !r) return;
    u.disabled = !this.can(-1);
    r.disabled = !this.can(1);
  }
};

/* ============================ PNG chunks ============================ */
const CRC = (() => {
  const t = new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; }
  return b => { let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c = t[(c^b[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
})();
const PNG_SIG = [137,80,78,71,13,10,26,10];

async function inflate(bytes){
  const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
function parseChunks(u8){
  for(let i=0;i<8;i++) if(u8[i] !== PNG_SIG[i]) throw new Error('Not a PNG file');
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  const out = []; let p = 8;
  while(p < u8.length){
    const len = dv.getUint32(p);
    const type = String.fromCharCode(u8[p+4],u8[p+5],u8[p+6],u8[p+7]);
    out.push({type, data: u8.subarray(p+8, p+8+len)});
    p += 12 + len;
    if(type === 'IEND') break;
  }
  return out;
}
function buildPNG(chunks){
  let total = 8;
  for(const c of chunks) total += 12 + c.data.length;
  const out = new Uint8Array(total); out.set(PNG_SIG, 0);
  const dv = new DataView(out.buffer); let p = 8;
  for(const c of chunks){
    dv.setUint32(p, c.data.length); p += 4;
    const tb = new Uint8Array(4);
    for(let i=0;i<4;i++) tb[i] = c.type.charCodeAt(i);
    out.set(tb, p); p += 4;
    out.set(c.data, p); p += c.data.length;
    const buf = new Uint8Array(4 + c.data.length);
    buf.set(tb,0); buf.set(c.data,4);
    dv.setUint32(p, CRC(buf)); p += 4;
  }
  return out;
}
const splitNul = u8 => { const i = u8.indexOf(0); return [u8.subarray(0,i), u8.subarray(i+1)]; };
const DEC = new TextDecoder(), ENC = new TextEncoder();

const b64ToStr = b64 => DEC.decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0)));
function strToB64(s){
  const b = ENC.encode(s); let bin = '';
  for(let i=0;i<b.length;i+=0x8000) bin += String.fromCharCode.apply(null, b.subarray(i, i+0x8000));
  return btoa(bin);
}
function textChunk(key, value){
  const k = ENC.encode(key), v = ENC.encode(value);
  const d = new Uint8Array(k.length + 1 + v.length);
  d.set(k,0); d[k.length] = 0; d.set(v, k.length+1);
  return {type:'tEXt', data:d};
}

function emptyCard(){
  return {name:'', description:'', personality:'', scenario:'', first_mes:'', mes_example:'',
    system_prompt:'', post_history_instructions:'', creator_notes:'', creator:'',
    character_version:'', tags:[], alternate_greetings:[], character_book:null, extensions:{}};
}

async function readCardFile(file){
  const buf = new Uint8Array(await file.arrayBuffer());
  const rec = {srcName:file.name, png:null, chunks:null, data:emptyCard(), spec:'chara_card_v2',
               gingerXml:null, portraitBlob:null};

  if(file.name.toLowerCase().endsWith('.json')){
    const json = JSON.parse(DEC.decode(buf));
    Object.assign(rec.data, json.data || json);
    rec.spec = json.spec || 'chara_card_v2';
    rec.original = clone(rec.data);
    return rec;
  }

  const chunks = parseChunks(buf);
  rec.png = buf; rec.chunks = chunks;
  let charaB64 = null, ccv3B64 = null, gingerB64 = null;

  for(const c of chunks){
    if(c.type === 'tEXt' || c.type === 'zTXt'){
      const [k, restRaw] = splitNul(c.data);
      const key = DEC.decode(k);
      let text;
      if(c.type === 'zTXt') text = DEC.decode(await inflate(restRaw.subarray(1)));
      else text = DEC.decode(restRaw);
      if(key === 'chara')  charaB64  = text;
      if(key === 'ccv3')   ccv3B64   = text;
      if(key === 'ginger') gingerB64 = text;
    }
  }
  const src = ccv3B64 || charaB64;
  if(!src) throw new Error('No character data found in this PNG');
  const json = JSON.parse(b64ToStr(src));
  Object.assign(rec.data, json.data || json);
  rec.spec = json.spec || 'chara_card_v2';
  if(gingerB64) rec.gingerXml = b64ToStr(gingerB64);
  rec.portraitBlob = new Blob([buf], {type:'image/png'});
  rec.original = clone(rec.data);
  return rec;
}

function cardToJSON(rec){
  const d = rec.data;
  const data = {
    name:d.name||'', description:d.description||'', personality:d.personality||'',
    scenario:d.scenario||'', first_mes:d.first_mes||'', mes_example:d.mes_example||'',
    creator_notes:d.creator_notes||'', system_prompt:d.system_prompt||'',
    post_history_instructions:d.post_history_instructions||'',
    alternate_greetings:d.alternate_greetings||[], character_book:d.character_book||undefined,
    tags:d.tags||[], creator:d.creator||'', character_version:d.character_version||'',
    extensions:d.extensions||{}
  };
  return {spec:'chara_card_v2', spec_version:'2.0',
    name:data.name, description:data.description, personality:data.personality,
    scenario:data.scenario, first_mes:data.first_mes, mes_example:data.mes_example, data};
}

/* Rebuild the PNG: replace chara/ccv3, keep every other chunk — including ginger — untouched. */
function exportPNG(rec){
  if(!rec.chunks) throw new Error('This card has no source image. Add a portrait first.');
  const payload = strToB64(JSON.stringify(cardToJSON(rec)));
  const out = [];
  let wroteChara = false;
  for(const c of rec.chunks){
    if(c.type === 'tEXt' || c.type === 'zTXt'){
      const key = DEC.decode(splitNul(c.data)[0]);
      if(key === 'chara'){ out.push(textChunk('chara', payload)); wroteChara = true; continue; }
      if(key === 'ccv3'){ continue; }          // drop stale v3 copy; v2 is authoritative here
    }
    if(c.type === 'IEND' && !wroteChara){ out.push(textChunk('chara', payload)); wroteChara = true; }
    out.push(c);
  }
  return buildPNG(out);
}

/* A card with no image cannot be exported as a PNG, so a card built from
   scratch gets a plain placeholder immediately. Replace portrait swaps it. */
async function placeholderPNG(){
  const W = 512, H = 768;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#2b3230'); grad.addColorStop(1, '#171b19');
  g.fillStyle = grad; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(217,139,69,.5)'; g.lineWidth = 2;
  g.strokeRect(18, 18, W - 36, H - 36);
  g.fillStyle = 'rgba(217,139,69,.75)';
  g.font = '500 26px "IBM Plex Mono", monospace';
  g.textAlign = 'center';
  g.fillText('NO PORTRAIT YET', W / 2, H / 2 - 6);
  g.fillStyle = 'rgba(231,234,230,.4)';
  g.font = '400 17px "IBM Plex Sans", sans-serif';
  g.fillText('Tap Replace portrait', W / 2, H / 2 + 28);
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  return new Uint8Array(await blob.arrayBuffer());
}

async function newCard(){
  const rec = {srcName:'', png:null, chunks:null, data:emptyCard(),
               spec:'chara_card_v2', gingerXml:null, portraitBlob:null, original:null};

  rec.png = u8; rec.chunks = parseChunks(u8);
  rec.portraitBlob = new Blob([u8], {type:'image/png'});

  return rec;
}

const DB = {
  h:null,
  async open(){
    if(this.h) return this.h;
    this.h = await new Promise((res,rej) => {
      const rq = indexedDB.open('ginger-studio', 1);
      rq.onupgradeneeded = () => {
        const db = rq.result;
        if(!db.objectStoreNames.contains('cards')) db.createObjectStore('cards', {keyPath:'id'});
      };
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    });
    return this.h;
  },
  async tx(mode, fn){
    const db = await this.open();
    return new Promise((res,rej) => {
      const t = db.transaction('cards', mode);
      const r = fn(t.objectStore('cards'));
      t.oncomplete = () => res(r && r.result !== undefined ? r.result : r);
      t.onerror = () => rej(t.error);
    });
  },
  all(){ return this.tx('readonly', s => s.getAll()); },
  get(id){ return this.tx('readonly', s => s.get(id)); },
  put(v){ return this.tx('readwrite', s => s.put(v)); },
  del(id){ return this.tx('readwrite', s => s.delete(id)); }
};

async function saveCard(rec){
  if(!rec.id) rec.id = 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  rec.updated = Date.now();
  await DB.put({id:rec.id, updated:rec.updated, srcName:rec.srcName, spec:rec.spec,
    data:rec.data, original:rec.original || null, gingerXml:rec.gingerXml,
    concept:rec.concept || '', png:rec.png ? rec.png : null});
  return rec;
}
async function hydrate(row){
  const rec = {id:row.id, updated:row.updated, srcName:row.srcName, spec:row.spec,
    data:Object.assign(emptyCard(), row.data), original:row.original || null,
    concept:row.concept || '', gingerXml:row.gingerXml, png:null, chunks:null, portraitBlob:null};
  if(row.png){
    const u8 = row.png instanceof Uint8Array ? row.png : new Uint8Array(row.png);
    rec.png = u8;
    try{ rec.chunks = parseChunks(u8); }catch(e){ rec.chunks = null; }
    rec.portraitBlob = new Blob([u8], {type:'image/png'});
  }
  /* Cards stored before revert existed have no saved original. The stored PNG is never
     rewritten though, so the values it shipped with are still in its chara chunk. */
  if(!rec.original && rec.chunks){
    try{
      let b64 = null;
      for(const c of rec.chunks){
        if(c.type !== 'tEXt' && c.type !== 'zTXt') continue;
        const [k, rest] = splitNul(c.data);
        const key = DEC.decode(k);
        if(key !== 'chara' && key !== 'ccv3') continue;
        const text = c.type === 'zTXt' ? DEC.decode(await inflate(rest.subarray(1))) : DEC.decode(rest);
        if(key === 'chara' || !b64) b64 = text;
      }
      if(b64){
        const json = JSON.parse(b64ToStr(b64));
        rec.original = Object.assign(emptyCard(), json.data || json);
      }
    }catch(e){ rec.original = null; }
  }
  return rec;
}

/* ---- name bleed ----
   Literal names in card text leak into generated replies. This is a plain text pass,
   not a model call: deterministic, free, and reviewed as a diff like any AI edit. */
const rxEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

function nameVariants(rec){
  const out = [];
  const push = n => { n = (n || '').trim(); if(n.length >= 2 && out.indexOf(n) === -1) out.push(n); };
  const full = (rec.data.name || '').trim();
  push(full);
  const first = full.split(/\s+/)[0];
  if(first !== full) push(first);
  if(rec.gingerXml){                       // Ginger cards often carry a fuller name
    const m = rec.gingerXml.match(/<Parameter id="full-name">(?:<!\[CDATA\[)?([^<\]]+)/);
    if(m){ push(m[1]); const f2 = m[1].trim().split(/\s+/)[0]; if(f2) push(f2); }
  }
  return out.sort((a, b) => b.length - a.length);   // longest first so full names win
}

function fixNames(text, rec){
  if(!text) return text;
  const holds = [];
  let out = text.replace(/\{\{[^}]*\}\}/g, m => { holds.push(m); return '\u0000' + (holds.length - 1) + '\u0000'; });
  for(const n of nameVariants(rec))
    out = out.replace(new RegExp('\\b' + rxEsc(n) + '\\b', 'g'), '{{char}}');
  return out.replace(/\u0000(\d+)\u0000/g, (m, i) => holds[+i]);
}


/* Fields the "build from a concept" flow writes. Order is the review order. */
const GEN_FIELDS = [
  ['name',        'Name'],
  ['description', 'Description'],
  ['personality', 'Personality'],
  ['scenario',    'Scenario'],
  ['first_mes',   'First message'],
  ['mes_example', 'Example messages'],
  ['tags',        'Tags']
];

async function generateFromConcept(concept, existing){
  const system =
    'You write character cards for AI roleplay frontends such as SillyTavern. ' +
    'These are creative fiction and may involve mature or explicit themes; treat them as fiction and write them fully. ' +
    'Reply with ONE JSON object and nothing else — no prose, no markdown fences.\n\n' +
    'Keys, all strings except tags:\n' +
    '  name         — the character\'s name, nothing else\n' +
    '  description  — who they are: appearance, background, situation. The longest field.\n' +
    '  personality  — traits, manner, voice. A few sentences or a comma list.\n' +
    '  scenario     — the situation the roleplay opens in.\n' +
    '  first_mes    — the character\'s opening message, in their voice. Use *asterisks* for actions.\n' +
    '  mes_example  — 2-3 exchanges showing their voice. Format each block as:\n' +
    '                 <START>\\n{{user}}: ...\\n{{char}}: ...\n' +
    '  tags         — array of 3-6 short lowercase strings\n\n' +
    'Write {{char}} for the character and {{user}} for the human. Never invent a name for {{user}}.';
  const user =
    'Character concept:\n---\n' + concept + '\n---\n' +
    (existing ? '\nAlready written, keep consistent with it and do not contradict it:\n---\n' + existing + '\n---' : '');

  const raw = await AI.complete(system, user);
  let txt = raw.trim().replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '');
  const a = txt.indexOf('{'), b = txt.lastIndexOf('}');
  if(a === -1 || b <= a) throw new Error('The model did not return JSON. Try again, or pick a different model.');
  let obj;
  try{ obj = JSON.parse(txt.slice(a, b+1)); }
  catch(e){ throw new Error('The model returned malformed JSON. Try again, or pick a different model.'); }

  const out = {};
  for(const [k] of GEN_FIELDS){
    let v = obj[k];
    if(k === 'tags'){
      if(Array.isArray(v)) v = v.map(String).map(s => s.trim()).filter(Boolean);
      else if(typeof v === 'string') v = v.split(',').map(s => s.trim()).filter(Boolean);
      else v = null;
      if(v && v.length) out[k] = v;
    } else if(typeof v === 'string' && v.trim()){
      out[k] = v.trim();
    }
  }
  if(!Object.keys(out).length) throw new Error('The model returned no usable fields. Try again.');
  return out;
}

function reviewSheet(draft){

}

function aiContext(rec){
  const d = rec.data, parts = [];
  if(d.name) parts.push('Character name: ' + d.name);
  for(const [k, lbl] of TEXT_FIELDS){
    if(k === 'creator_notes') continue;
    const v = d[k];
    if(v && v.length < 900) parts.push(lbl + ': ' + v);
  }
  return parts.join('\n\n');
}

async function runAI(rec, fieldKey, fieldLabel, task, current){

/* ---------------------------------------------------------------- drag to reorder
   Pointer events so one code path covers mouse, touch and pen. The dragged row is
   moved in the DOM live; the array is rebuilt once, on release. */
function makeDraggable(container, itemSel, handleSel, onReorder){
  let held = null, moved = false;

  const itemsOf = () => Array.from(container.querySelectorAll(itemSel));

  container.addEventListener('pointerdown', e => {
    const h = e.target.closest(handleSel);
    if(!h || e.button > 0) return;
    held = h.closest(itemSel);
    if(!held) return;
    moved = false;
    e.preventDefault();
    try{ h.setPointerCapture(e.pointerId); }catch(err){}
    held.classList.add('dragging');
    document.body.classList.add('dragging');
  });

  container.addEventListener('pointermove', e => {
    if(!held) return;
    e.preventDefault();
    moved = true;
    for(const it of itemsOf()){
      if(it === held) continue;
      const r = it.getBoundingClientRect();
      const mid = r.top + r.height / 2;
      const heldAfter = !!(it.compareDocumentPosition(held) & Node.DOCUMENT_POSITION_FOLLOWING);
      if(e.clientY < mid && heldAfter){ container.insertBefore(held, it); break; }
      if(e.clientY > mid && !heldAfter){ container.insertBefore(held, it.nextSibling); break; }
    }
  });

  const end = () => {
    if(!held) return;
    held.classList.remove('dragging');
    document.body.classList.remove('dragging');
    const order = itemsOf().map(it => +it.dataset.gi);
    held = null;
    if(moved) onReorder(order);
  };
  container.addEventListener('pointerup', end);
  container.addEventListener('pointercancel', end);
  container.addEventListener('lostpointercapture', end);
}

/* ---------------------------------------------------------------- clone a card */
async function cloneCard(rec){
  const copy = {
    srcName: rec.srcName,
    spec: rec.spec,
    gingerXml: rec.gingerXml,
    concept: rec.concept || '',
    data: clone(rec.data),
    /* The clone's baseline is where it starts, not where the original card came
       from — Revert on a copy should mean "back to how this copy began". */
    original: clone(rec.data),
    png: rec.png ? rec.png.slice(0) : null,
    chunks: null,
    portraitBlob: null
  };
  copy.data.name = (copy.data.name || 'Untitled') + ' (copy)';
  if(copy.png){
    try{ copy.chunks = parseChunks(copy.png); }catch(e){ copy.chunks = null; }
    copy.portraitBlob = new Blob([copy.png], {type:'image/png'});
  }
  await saveCard(copy);
  return copy;
}

/* ---------------------------------------------------------------- smart edit
   One instruction ("a knight who is always scared", add or remove) carried out across
   the whole card. The model proposes small find-and-replace edits, not rewritten fields,
   and the app makes them: text the instruction is not about stays exactly as it was,
   and every edit can be unticked before anything changes. */
const SMART = {mode:'add', text:''};

const SMART_SYSTEM =
  'You edit character cards for AI roleplay. These cards are creative fiction and may contain mature or explicit themes; treat them as fiction and write them fully.\n\n' +
  'The author gives one instruction: something to ADD to the character, or something to REMOVE. ' +
  'Go through every block of the card and propose the smallest set of edits that carries it out.\n' +
  '- ADD: put each detail where it belongs: looks and history in the description, traits and manner in the personality, the situation in the scenario. ' +
  'Change greetings and example messages only where the character would now visibly act or speak differently. Do not repeat one fact in many blocks. ' +
  'A lorebook entry suits world facts that only matter when a topic comes up.\n' +
  '- REMOVE: the instruction may name the thing itself ("being scared") or the result the author wants ("a knight who is not scared"); either way, take out what the card says about it. ' +
  'Find every passage that states or implies it, including indirect wording, behaviour and dialogue, and delete or rewrite it. ' +
  'Rewrite rather than delete when deleting would leave a sentence broken.\n' +
  '- Leave everything unrelated to the instruction exactly as it is. Match the voice and formatting around each edit (*asterisks*, line breaks, <START> blocks).\n' +
  '- Write {{char}} for the character and {{user}} for the human. Keep existing {{char}} and {{user}} as they are.\n\n' +
  'Reply with ONE JSON object and nothing else, no prose, no markdown fences:\n' +
  '{"changes":[{"field":"<block id>","find":"<passage to change>","replace":"<new text>","why":"<one short sentence>"}]}\n' +
  '- field: the block id exactly as written after === in the card, e.g. description, alternate_greetings[0], lore[2].\n' +
  '- find: copied character for character from that block. Keep it short, a sentence or a clause, but long enough to appear only once in the block. Use "" to add new text at the end of the block.\n' +
  '- replace: the new text for that passage. Use "" to delete the passage.\n' +
  '- To add a new lorebook entry, use field "lore_new", put the entry text in replace, and add "keys": a list of 1-4 trigger words.\n' +
  '- If nothing needs to change, reply {"changes":[]}.';

/* Every block the model may edit, in card order. Creator notes are for people and never
   reach a chat model, so they are left out. Built fresh each time: undo swaps in a new
   copy of the card data, and a target must point at the copy that is live now. */
function smartTargets(rec){
  const d = rec.data, out = [];
  for(const [k, lbl] of TEXT_FIELDS){
    if(k === 'creator_notes') continue;
    out.push({id:k, label:lbl, get:() => d[k] || '', set:v => { d[k] = v; }});
  }
  (d.alternate_greetings || []).forEach((g, i) => out.push({
    id:'alternate_greetings[' + i + ']', label:'Greeting ' + (i + 1),
    get:() => d.alternate_greetings[i] || '', set:v => { d.alternate_greetings[i] = v; }}));
  ((d.character_book && d.character_book.entries) || []).forEach((e, i) => out.push({
    id:'lore[' + i + ']', label:'Lore entry ' + (i + 1), keys:e.keys || e.key || [],
    get:() => e.content || '', set:v => { e.content = v; }}));
  return out;
}

/* Collapses runs of whitespace and straightens curly quotes, keeping where each
   character came from, so a passage the model copied loosely can still be found. */
function smartNorm(s){
  const out = [], at = [];
  let space = false;
  for(let i = 0; i < s.length; i++){
    let c = s[i];
    if(/\s/.test(c)){ if(space) continue; c = ' '; space = true; }
    else{
      space = false;
      if(c === '‘' || c === '’') c = "'";
      else if(c === '“' || c === '”') c = '"';
    }
    out.push(c); at.push(i);
  }
  return {text:out.join(''), at};
}

function smartLocate(text, find){
  if(!find) return null;
  const i = text.indexOf(find);
  if(i !== -1) return [i, i + find.length];
  const T = smartNorm(text), F = smartNorm(find.trim());
  if(!F.text) return null;
  const j = T.text.indexOf(F.text);
  if(j === -1) return null;
  return [T.at[j], T.at[j + F.text.length - 1] + 1];
}

/* The field's new text with one edit made, or null when its passage is not there. */
function smartApply(text, ch){
  if(!ch.find){
    const add = ch.replace.trim();
    return text.trim() ? text.replace(/\s+$/, '') + '\n\n' + add : add;
  }
  const at = smartLocate(text, ch.find);
  if(!at) return null;
  const before = text.slice(0, at[0]), after = text.slice(at[1]);
  if(ch.replace) return before + ch.replace + after;
  // A deleted sentence leaves the spaces or line breaks either side of it doubled.
  const b = before.replace(/[ \t]+$/, ''), a = after.replace(/^[ \t]+/, '');
  if(!b) return a.replace(/^\n+/, '');
  if(!a) return b.replace(/\n+$/, '');
  if(/\n$/.test(b) && /^\n/.test(a)) return b + a.replace(/^\n+/, '');
  if(/\n$/.test(b) || /^\n/.test(a)) return b + a;
  return b + ' ' + a;
}

async function smartEditAsk(rec, mode, instruction){
  const targets = smartTargets(rec);
  const card = targets.map(t =>
    '=== ' + t.id + (t.keys && t.keys.length ? ' (keys: ' + t.keys.join(', ') + ')' : '') + ' ===\n' +
    (t.get().trim() || '(empty)')).join('\n\n');
  const user =
    (mode === 'add' ? 'ADD to the character: ' : 'REMOVE from the character: ') + instruction +
    '\n\nCharacter name: ' + (rec.data.name || '(none)') +
    '\n\nThe card, one block per field:\n\n' + card;

  const raw = await AI.complete(SMART_SYSTEM, user);
  let txt = raw.trim().replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '');
  const a = txt.indexOf('{'), b = txt.lastIndexOf('}');
  if(a === -1 || b <= a) throw new Error('The model did not return JSON. Try again, or pick a different model.');
  let obj;
  try{ obj = JSON.parse(txt.slice(a, b + 1)); }
  catch(e){ throw new Error('The model returned malformed JSON. Try again, or pick a different model.'); }

  const byId = {}, order = {};
  targets.forEach((t, i) => { byId[t.id] = t; order[t.id] = i; });
  const str = v => typeof v === 'string' ? v : '';
  return (Array.isArray(obj.changes) ? obj.changes : []).map(c => {
    c = c || {};
    const ch = {field:str(c.field).trim(), find:str(c.find), replace:str(c.replace), why:str(c.why).trim()};
    if(ch.find.trim() === '(empty)') ch.find = '';
    if(ch.field === 'lore_new'){
      const k = c.keys;
      ch.keys = (Array.isArray(k) ? k.map(String) : typeof k === 'string' ? k.split(',') : [])
        .map(s => s.trim()).filter(Boolean);
      ch.label = 'New lore entry';
      ch.ok = !!ch.replace.trim();
      if(!ch.ok) ch.reason = 'The entry came back empty, so it is skipped.';
      return ch;
    }
    const t = byId[ch.field];
    ch.label = t ? t.label : (ch.field || 'Unknown field');
    ch.ok = !!t && smartApply(t.get(), ch) !== null;
    if(!t) ch.reason = 'That field is not on this card, so it is skipped.';
    else if(!ch.ok) ch.reason = 'Could not find this passage in the field, so it is skipped.';
    return ch;
  }).filter(ch => ch.find !== ch.replace)
    .sort((x, y) => (x.field in order ? order[x.field] : 1e9) - (y.field in order ? order[y.field] : 1e9));
}

function smartReviewSheet(mode, instruction, changes){
  const rec = CURRENT;
  openSheet(sh => {
    sh.classList.add('tall');
    sh.appendChild(el('h3', null, (mode === 'add' ? 'Add: ' : 'Remove: ') + instruction));

    const btns = el('div','sheetbtns');
    const back = el('button','iconbtn','Back');
    back.onclick = smartEditSheet;
    const again = el('button','iconbtn','Try again');
    again.onclick = async () => {
      again.disabled = true; back.disabled = true;
      again.innerHTML = '<span class="spin"></span>';
      try{ smartReviewSheet(mode, instruction, await smartEditAsk(rec, mode, instruction)); }
      catch(e){ again.disabled = false; back.disabled = false; again.textContent = 'Try again'; toast(e.message, 4200); }
    };

    if(!changes.length){
      sh.appendChild(el('p','desc', 'The model found nothing on the card to change for that.'));
      btns.appendChild(back); btns.appendChild(again);
      sh.appendChild(btns);
      return;
    }
    sh.appendChild(el('p','desc',
      'Ticked edits get made. Untick any you do not want. Everything else on the card stays as it is.'));

    const boxes = [];
    const list = el('div','field');
    const yes = el('button','iconbtn primary');
    const count = () => {
      const n = boxes.filter(b => b.checked).length;
      yes.textContent = 'Apply ' + n;
      yes.disabled = !n;
    };
    changes.forEach(ch => {
      const row = el('div','smartrow' + (ch.ok ? '' : ' off'));
      const cb = el('input'); cb.type = 'checkbox';
      cb.checked = ch.ok; cb.disabled = !ch.ok;
      cb.onchange = count;
      boxes.push(cb);
      row.appendChild(cb);
      const sb = el('div','sb');
      const kind = ch.field === 'lore_new' || !ch.find ? 'add' : ch.replace ? 'change' : 'remove';
      sb.appendChild(el('div','sn', ch.label + ' · ' + kind));
      if(ch.why || ch.reason) sb.appendChild(el('div','sw', ch.reason || ch.why));
      if(ch.find){
        const o = el('div','diffbox old');
        o.appendChild(el('div','cap', ch.replace ? 'Now' : 'Taken out'));
        o.appendChild(el('div','txt', ch.find));
        sb.appendChild(o);
      }
      if(ch.replace){
        const n = el('div','diffbox new');
        n.appendChild(el('div','cap', ch.field === 'lore_new'
          ? 'Keys: ' + (ch.keys.join(', ') || 'none') : ch.find ? 'After' : 'Added at the end'));
        n.appendChild(el('div','txt', ch.replace));
        sb.appendChild(n);
      }
      row.appendChild(sb);
      list.appendChild(row);
    });
    sh.appendChild(list);
    count();

    yes.onclick = () => {
      if(Hist.pending) Hist.commit(Hist.pending);
      const picked = changes.filter((ch, i) => boxes[i].checked);
      const byId = {};
      smartTargets(rec).forEach(t => { byId[t.id] = t; });
      let done = 0, missed = 0;
      for(const ch of picked){
        if(ch.field === 'lore_new'){
          const book = (rec.data.character_book = rec.data.character_book || {name:'', entries:[]});
          (book.entries = book.entries || []).push(
            {keys:ch.keys, content:ch.replace.trim(), enabled:true, insertion_order:100});
          done++;
          continue;
        }
        const t = byId[ch.field];
        const out = t ? smartApply(t.get(), ch) : null;
        if(out === null){ missed++; continue; }
        t.set(out);
        done++;
      }
      if(!done){ toast('None of those could be placed. The card text changed after they were proposed.', 4200); return; }
      Hist.commit('smart edit');
      queueSave(); closeSheet(); selectTab(TAB);
      toast('Made ' + done + ' edit' + (done === 1 ? '' : 's') +
        (missed ? ', skipped ' + missed + ' whose text an earlier edit had already changed' : '') +
        ' — undo with ↶', 4200);
    };
    btns.appendChild(back); btns.appendChild(again); btns.appendChild(yes);
    sh.appendChild(btns);
  });
}

  get(){ try{ return localStorage.getItem('gcs-libview') === 'list' ? 'list' : 'grid'; }catch(e){ return 'grid'; } },
  set(v){ try{ localStorage.setItem('gcs-libview', v); }catch(e){} }
};

function rowMeta(row){
  const bits = [];
  if(row.gingerXml){
    const n = (row.gingerXml.match(/<Recipe /g) || []).length;
    if(n) bits.push(n + ' recipes');
  }
  const lore = row.data && row.data.character_book && row.data.character_book.entries;
  if(lore && lore.length) bits.push(lore.length + ' lore');
  const alts = row.data && row.data.alternate_greetings;
  if(alts && alts.length) bits.push(alts.length + ' greetings');
  return bits.join(' · ') || 'card';
}

function rowPortraitURL(row){
  if(!row.png) return null;
  const u8 = row.png instanceof Uint8Array ? row.png : new Uint8Array(row.png);
  return URL.createObjectURL(new Blob([u8], {type:'image/png'}));
}

      const name = (row.data && row.data.name) || 'this card';
      if(!confirm('Delete "' + name + '"? Export it first if you want to keep it.')) return;
      await DB.del(row.id);
      closeSheet(); renderLibrary();
      toast('Deleted "' + name + '"');
    });
    del.style.color = 'var(--danger)';
    del.style.borderColor = 'var(--danger)';
    sh.appendChild(del);

    const cancel = mk('Cancel', '', closeSheet);
    cancel.style.marginBottom = '0';
    sh.appendChild(cancel);
  });
}

async function renderLibrary(){
  const host = $('v-library'); host.innerHTML = '';
  let rows = [];
  try{ rows = await DB.all(); }
  catch(e){ host.appendChild(el('div','note','Could not open the card library: ' + e.message)); return; }
  rows.sort((a,b) => (b.updated||0) - (a.updated||0));

  if(!rows.length){
    const e0 = el('div','empty');
    e0.appendChild(el('p', null, 'No cards yet.'));
    e0.appendChild(el('p', null, 'Tap Import to add a character card PNG or JSON, or + New to build one from a concept.'));
    host.appendChild(e0);
    return;
  }

  // view switch
  const bar = el('div','libbar');
  bar.appendChild(el('span','tok', rows.length + (rows.length === 1 ? ' card' : ' cards')));
  bar.appendChild(el('span','spacer'));
  const seg = el('div','seg');
  const view = LIBVIEW.get();
  for(const [id, label] of [['grid','Cards'], ['list','List']]){
    const b = el('button','segbtn', label);
    b.setAttribute('aria-pressed', String(view === id));
    b.onclick = () => { LIBVIEW.set(id); renderLibrary(); };
    seg.appendChild(b);
  }
  bar.appendChild(seg);
  host.appendChild(bar);

  if(view === 'list'){
    const list = el('div','cardlist');
    for(const row of rows){
      const it = el('div','listrow');
      const main = el('button','listmain');
      main.appendChild(el('div','nm', (row.data && row.data.name) || '(unnamed)'));
      main.appendChild(el('div','sub', rowMeta(row)));
      main.onclick = () => openRow(row.id);
      it.appendChild(main);
      const more = el('button','morebtn','⋯');
      more.setAttribute('aria-label','Actions for ' + ((row.data && row.data.name) || 'card'));
      more.onclick = () => cardMenu(row);
      it.appendChild(more);
      list.appendChild(it);
    }
    host.appendChild(list);
    return;
  }

  const grid = el('div','grid');
  for(const row of rows){
    const tile = el('div','cardtile');
    const open = el('button','tileopen');
    const img = el('img'); img.alt = '';
    const src = rowPortraitURL(row);
    if(src) img.src = src;
    open.appendChild(img);
    const meta = el('div','meta');
    meta.appendChild(el('div','nm', (row.data && row.data.name) || '(unnamed)'));
    meta.appendChild(el('div','sub', rowMeta(row)));
    open.appendChild(meta);
    open.onclick = () => openRow(row.id);
    tile.appendChild(open);

    const more = el('button','morebtn tile','⋯');
    more.setAttribute('aria-label','Actions for ' + ((row.data && row.data.name) || 'card'));
    more.onclick = e => { e.stopPropagation(); cardMenu(row); };
    tile.appendChild(more);
    grid.appendChild(tile);
  }
  host.appendChild(grid);
}

/* A text target the editing tools can act on. Most are a named card field, but a
   greeting is an array slot — same tools, different address. */
function fieldRef(key){
  const m = /^alternate_greetings\[(\d+)\]$/.exec(key);
  if(m){
    const i = +m[1];
    return {
      key, index: i, isGreeting: true,
      promptKey: 'alternate_greetings',
      get(){ const a = CURRENT.data.alternate_greetings; return (a && a[i]) || ''; },
      set(v){ const a = (CURRENT.data.alternate_greetings = CURRENT.data.alternate_greetings || []); a[i] = v; },
      original(){ const o = CURRENT.original && CURRENT.original.alternate_greetings;
        return o && typeof o[i] === 'string' ? o[i] : undefined; }
    };
  }
  return {
    key, isGreeting: false,
    promptKey: key,
    get(){ return CURRENT.data[key] || ''; },
    set(v){ CURRENT.data[key] = v; },
    original(){ const o = CURRENT.original; return o && typeof o[key] === 'string' ? o[key] : undefined; }
  };
}

/* Refresh one target's row without rebuilding the tab (which would close an open sheet). */
function syncField(key){
  const f = fieldBox.sync[key];
  if(f){ f(); return; }
  if(/^alternate_greetings\[/.test(key) && TAB === 'card' && CURRENT) renderCard();
}

/* The shared action row: the same tools wherever text is edited. */
function textActions(key, label, sync, opts){
  opts = opts || {};
  const rec = CURRENT, ref = fieldRef(key);
  const bar = el('div','fieldbtns');
  const state = {};

  for(const t of Object.keys(AI_TASKS)){
    const b = el('button','aibtn', AI_TASKS[t].label);
    b.disabled = !AI.ready;
    b.title = AI.ready ? '' : 'Add an OpenRouter key in Settings';
    b.onclick = () => { if(Hist.pending) Hist.commit(Hist.pending); aiSheet(key, label, t, opts.fromEditor); };
    bar.appendChild(b);
  }

  const namesBtn = el('button','minibtn','Names');
  namesBtn.title = 'Replace the character name with {{char}}';
  namesBtn.onclick = () => { if(Hist.pending) Hist.commit(Hist.pending); namesSheet(key, label, opts.fromEditor); };
  bar.appendChild(namesBtn);
  state.namesBtn = namesBtn;

  bar.appendChild(el('span','spacer'));

  if(opts.prompt){
    const pb = el('button','minibtn prompt','Prompt');
    if(Prompts.customised(ref.promptKey)) pb.classList.add('on');
    pb.onclick = () => promptSheet(ref.promptKey, label, opts.fromEditor);
    bar.appendChild(pb);
  }

  const orig = ref.original();
  if(typeof orig === 'string' && !opts.noRevert){
    const rb = el('button','minibtn revert','Revert');
    rb.title = 'Put back the value this card was imported with';
    rb.onclick = () => {
      ref.set(orig); Hist.commit('revert ' + label.toLowerCase()); queueSave(); sync(); syncField(key);
      toast(orig ? 'Reverted to the imported value' : 'Reverted — this was empty on the card');
    };
    bar.appendChild(rb);
    state.revertBtn = rb;
    state.orig = orig;
  }

  if(!opts.noClear){
    const cb = el('button','minibtn','Clear');
    cb.onclick = () => {
      ref.set(''); Hist.commit('clear ' + label.toLowerCase()); queueSave(); sync(); syncField(key);
      toast('Cleared — undo with ↶');
    };
    bar.appendChild(cb);
    state.clearBtn = cb;
  }

  bar.refresh = () => {
    const v = ref.get();
    if(state.clearBtn)  state.clearBtn.disabled  = !v;
    if(state.revertBtn) state.revertBtn.disabled = (v === state.orig);
    if(state.namesBtn)  state.namesBtn.disabled  = !AI.hasNames(rec) || fixNames(v, rec) === v;
  };
  bar.refresh();
  return bar;
}

/* A tappable preview that opens the editing sheet. */
function textPreview(key, label, sync){
  const p = el('div','preview');
  p.tabIndex = 0;
  p.setAttribute('role','button');
  p.setAttribute('aria-label','Edit ' + label);
  const open = () => editorSheet(key, label);
  p.onclick = open;
  p.onkeydown = e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); } };
  return p;
}

function fieldBox(labelText, key, multiline, opts){
  opts = opts || {};
  const rec = CURRENT, ref = fieldRef(key);
  const box = el('div','field');

  const head = el('div','head');
  head.appendChild(el('label', null, labelText));
  const tok = el('span','tok');
  head.appendChild(tok);
  if(multiline && opts.ai !== false){
    const pb = el('button','minibtn prompt','Prompt');
    pb.title = 'Edit the instruction sent to the model for this field';
    if(Prompts.customised(ref.promptKey)) pb.classList.add('on');
    pb.onclick = () => promptSheet(ref.promptKey, labelText);
    head.appendChild(pb);
  }
  box.appendChild(head);

  let preview = null, input = null, bar = null;

  const sync = () => {
    const v = ref.get();
    tok.textContent = multiline ? '~' + estTokens(v) + ' tok' : '';
    if(preview){
      preview.textContent = v || 'Empty — tap to write';
      preview.classList.toggle('placeholder', !v);
    }
    if(input && input.value !== v) input.value = v;
    if(bar && bar.refresh) bar.refresh();
  };
  fieldBox.sync[key] = sync;

  if(multiline){
    /* Long text is edited in a full-height sheet. The card shows a preview only —
       a four-line scrolling box is a bad place to write a character description. */
    preview = textPreview(key, labelText, sync);
    box.appendChild(preview);
    bar = textActions(key, labelText, sync, {});
    box.appendChild(bar);
  } else {
    input = el('input');
    input.type = 'text';
    input.value = esc(ref.get());
    input.spellcheck = true;
    input.oninput = () => { ref.set(input.value); sync(); Hist.coalesce('edit ' + labelText.toLowerCase()); queueSave(); };
    input.onblur  = () => { if(Hist.pending) Hist.commit(Hist.pending); };
    box.appendChild(input);
  }

  sync();
  return box;
}
fieldBox.sync = {};

/* ---------------------------------------------------------------- editor sheet */
function editorSheet(key, label){
  const rec = CURRENT;
  const ref = fieldRef(key);
  openSheet(sh => {
    sh.classList.add('tall');
    const bar = el('div','sheethead');
    bar.appendChild(el('h3', null, label));
    const t = el('span','tok');
    bar.appendChild(t);
    sh.appendChild(bar);

    const ta = el('textarea','editor');
    ta.value = ref.get();
    ta.spellcheck = true;
    const count = () => { t.textContent = '~' + estTokens(ta.value) + ' tok'; };
    count();
    ta.oninput = () => {
      ref.set(ta.value); count();
      Hist.coalesce('edit ' + label.toLowerCase());
      queueSave(); syncField(key);
    };
    sh.appendChild(ta);

    const acts = el('div','fieldbtns');
    for(const k of Object.keys(AI_TASKS)){
      const b = el('button','aibtn', AI_TASKS[k].label);
      b.disabled = !AI.ready;
      b.title = AI.ready ? '' : 'Add an OpenRouter key in Settings';
      b.onclick = () => { if(Hist.pending) Hist.commit(Hist.pending); aiSheet(key, label, k, true); };
      acts.appendChild(b);
    }
    const nb = el('button','minibtn','Names');
    nb.disabled = !AI.hasNames(rec) || fixNames(ta.value, rec) === ta.value;
    nb.title = 'Replace the character name with {{char}}';
    nb.onclick = () => { if(Hist.pending) Hist.commit(Hist.pending); namesSheet(key, label, true); };
    acts.appendChild(nb);
    acts.appendChild(el('span','spacer'));
    const pb = el('button','minibtn prompt','Prompt');
    if(Prompts.customised(fieldRef(key).promptKey)) pb.classList.add('on');
    pb.onclick = () => promptSheet(fieldRef(key).promptKey, label, true);
    acts.appendChild(pb);
    sh.appendChild(acts);

    const btns = el('div','sheetbtns');
    const done = el('button','iconbtn primary','Done');
    done.onclick = () => { if(Hist.pending) Hist.commit(Hist.pending); closeSheet(); syncField(key); };
    btns.appendChild(done);
    sh.appendChild(btns);

    setTimeout(() => { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }, 60);
  });
}

/* ---------------------------------------------------------------- name bleed sheet */
function namesSheet(key, label, backToEditor){
  const rec = CURRENT;
  const ref = fieldRef(key);
  const before = ref.get();
  const after = fixNames(before, rec);
  const back = () => { if(backToEditor) editorSheet(key, label); else closeSheet(); };

  if(after === before){ toast('No literal names found in ' + label); return; }

  openSheet(sh => {
    sh.appendChild(el('h3', null, 'Fix names · ' + label));
    sh.appendChild(el('p','desc',
      'Replacing ' + nameVariants(rec).map(n => '"' + n + '"').join(', ') +
      ' with {{char}}. Frontends substitute the real name at chat time, so the card stays reusable.'));

    const diff = el('div','diff');
    const b1 = el('div','diffbox');
    b1.appendChild(el('div','cap','Current'));
    b1.appendChild(el('div','txt', before));
    const b2 = el('div','diffbox new');
    b2.appendChild(el('div','cap','After'));
    b2.appendChild(el('div','txt', after));
    diff.appendChild(b1); diff.appendChild(b2);
    sh.appendChild(diff);

    const btns = el('div','sheetbtns');
    const no = el('button','iconbtn','Discard');
    no.onclick = back;
    const yes = el('button','iconbtn primary','Apply');
    yes.onclick = () => {
      ref.set(after);
      Hist.commit('fix names in ' + label.toLowerCase());
      queueSave(); syncField(key); back();
      toast('Names replaced — undo with ↶');
    };
    btns.appendChild(no); btns.appendChild(yes);
    sh.appendChild(btns);
  });
}

/* ---------------------------------------------------------------- prompt sheet */
function promptSheet(key, label, backToEditor, taskList){
  const back = () => { if(backToEditor) editorSheet(key, label); else closeSheet(); };
  openSheet(sh => {
    sh.classList.add('tall');
    sh.appendChild(el('h3', null, 'Prompt · ' + label));
    sh.appendChild(el('p','desc',
      'What the model is told when you use these buttons on this field. ' +
      'Blank a box to fall back to the default.'));

    const boxes = {};
    const TASKS = taskList || Object.keys(AI_TASKS);

    const gf = el('div','field');
    gf.appendChild(el('label', null, 'Extra guidance for this field'));
    const gta = el('textarea');
    gta.rows = 3;
    gta.placeholder = 'Optional. Added to every task above. e.g. "Write in second person." or "Keep it under 200 words."';
    gta.value = Prompts.guidance(key);
    gf.appendChild(gta);
    sh.appendChild(gf);

    for(const t of TASKS){
      const f = el('div','field');
      const h = el('div','head');
      h.appendChild(el('label', null, taskLabel(t)));
      const isCustom = Prompts.task(key, t) !== defaultInstr(t);
      const badge = el('span','tok', isCustom ? 'custom' : 'default');
      h.appendChild(badge);
      f.appendChild(h);
      const ta = el('textarea');
      ta.rows = 3;
      ta.value = Prompts.task(key, t);
      ta.placeholder = defaultInstr(t);
      ta.oninput = () => { badge.textContent = ta.value.trim() === defaultInstr(t) ? 'default' : 'custom'; };
      boxes[t] = ta;
      f.appendChild(ta);
      sh.appendChild(f);
    }

    const sf = el('div','field');
    sf.appendChild(el('label', null, 'System prompt (all fields)'));
    const sta = el('textarea');
    sta.rows = 5;
    sta.value = Prompts.system();
    sf.appendChild(sta);
    const sn = el('div','tok wrap');
    sn.textContent = 'Shared by every field. The placeholder rules here are what stop names bleeding into generated text — change them only if you mean to.';
    sf.appendChild(sn);
    sh.appendChild(sf);

    const btns = el('div','sheetbtns');
    const rst = el('button','iconbtn','Reset');
    rst.onclick = () => {
      Prompts.resetField(key);
      gta.value = '';
      for(const t of TASKS) boxes[t].value = defaultInstr(t);
      sta.value = BASE_SYSTEM;
      Prompts.setSystem('');
      toast('Reset to defaults');
      back();
    };
    const save = el('button','iconbtn primary','Save');
    save.onclick = () => {
      Prompts.setGuidance(key, gta.value);
      for(const t of TASKS) Prompts.setTask(key, t, boxes[t].value);
      Prompts.setSystem(sta.value);
      toast('Prompt saved for ' + label);
      back();
      if(TAB === 'card' && !backToEditor) renderCard();
    };
    btns.appendChild(rst); btns.appendChild(save);
    sh.appendChild(btns);
  });
}

function renderCard(){
  const host = $('v-card'); host.innerHTML = '';
  const rec = CURRENT, d = rec.data;

  // portrait + identity
  const pf = el('div','field');
  const pr = el('div','portrait');
  const img = el('img'); img.alt = '';
  if(rec.portraitBlob) img.src = URL.createObjectURL(rec.portraitBlob);
  pr.appendChild(img);
  const side = el('div','side');
  const nameIn = el('input'); nameIn.type = 'text'; nameIn.placeholder = 'Character name';
  nameIn.value = esc(d.name);
  nameIn.oninput = () => { d.name = nameIn.value; $('title').textContent = d.name || 'Untitled'; Hist.coalesce('edit name'); queueSave(); };
  nameIn.onblur = () => { if(Hist.pending) Hist.commit(Hist.pending); };
  side.appendChild(el('label', null, 'Name'));
  side.appendChild(nameIn);
  const swap = el('button','iconbtn','Replace portrait');
  swap.onclick = () => pickPortrait(img);
  side.appendChild(swap);
  pr.appendChild(side);
  pf.appendChild(pr);
  host.appendChild(pf);

  // meta row
  const mf = el('div','field');
  mf.appendChild(el('label', null, 'Creator / version / tags'));
  const row = el('div','row');
  const cr = el('input'); cr.type='text'; cr.placeholder='Creator'; cr.value = esc(d.creator);
  cr.oninput = () => { d.creator = cr.value; Hist.coalesce('edit creator'); queueSave(); };
  const vr = el('input'); vr.type='text'; vr.placeholder='Version'; vr.value = esc(d.character_version);
  vr.oninput = () => { d.character_version = vr.value; Hist.coalesce('edit version'); queueSave(); };
  row.appendChild(cr); row.appendChild(vr);
  mf.appendChild(row);
  const tg = el('input'); tg.type='text'; tg.placeholder='Tags, comma separated';
  tg.value = (d.tags||[]).join(', ');
  tg.oninput = () => { d.tags = tg.value.split(',').map(s=>s.trim()).filter(Boolean); Hist.coalesce('edit tags'); queueSave(); };
  mf.appendChild(tg);
  host.appendChild(mf);


  const gen = el('button','iconbtn primary','✦  Build from a concept');
  gen.style.width = '100%'; gen.style.padding = '13px'; gen.style.marginBottom = '4px';
  gen.disabled = !AI.ready;
  gen.title = AI.ready ? '' : 'Add an OpenRouter key in Settings';
  gen.onclick = conceptSheet;
  host.appendChild(gen);
  const smart = el('button','iconbtn','✦  Smart edit: add or remove a trait');
  smart.style.width = '100%'; smart.style.padding = '13px'; smart.style.margin = '4px 0';
  smart.disabled = !AI.ready;
  smart.title = AI.ready ? 'Change one thing about the character across the whole card' : 'Add an OpenRouter key in Settings';
  smart.onclick = smartEditSheet;
  host.appendChild(smart);
  if(!AI.ready){
    const h = el('div','tok wrap');
    h.style.margin = '0 0 8px'; h.textContent = 'Add an OpenRouter key in Settings to turn on the AI features.';
    host.appendChild(h);
  }

  host.appendChild(el('h2','sec','Card text'));
  for(const [k, lbl, multi] of TEXT_FIELDS) host.appendChild(fieldBox(lbl, k, multi));

  // alternate greetings
  const greets = (d.alternate_greetings = d.alternate_greetings || []);
  const gh = el('h2','sec','Alternate greetings');
  gh.classList.add('withbtn');
  const ghp = el('button','minibtn prompt','Prompt');
  ghp.title = 'Edit the instruction used to generate greetings';
  if(Prompts.customised(GREETING_KEY)) ghp.classList.add('on');
  ghp.onclick = () => promptSheet(GREETING_KEY, 'Alternate greetings', false, ['generate']);
  gh.appendChild(ghp);
  host.appendChild(gh);
  if(greets.length){
    const h = el('div','tok wrap');
    h.style.margin = '-4px 0 8px';
    h.textContent = 'Slot order is the order chat frontends offer them in. Drag the handle to reorder, ' +
      'or use the arrows. "Default" swaps a greeting with the first message at the top of the card.';
    host.appendChild(h);
  }

  const commitOrder = (order, label) => {
    if(Hist.pending) Hist.commit(Hist.pending);
    d.alternate_greetings = order.map(i => greets[i]);
    Hist.commit(label);
    queueSave(); renderCard();
  };
  const move = (from, to) => {
    if(to < 0 || to >= greets.length || from === to) return;
    const order = greets.map((_, i) => i);
    order.splice(to, 0, order.splice(from, 1)[0]);
    commitOrder(order, 'reorder greetings');
    toast('Moved to slot ' + (to + 1), 1400);
  };
  /* Promote: the chosen alternate becomes the card's first message and the old
     first message drops into the slot it vacated, so nothing is lost. */
  const promote = i => {
    if(Hist.pending) Hist.commit(Hist.pending);
    const old = d.first_mes || '';
    d.first_mes = greets[i];
    greets[i] = old;
    Hist.commit('promote greeting to default');
    queueSave(); renderCard(); syncField('first_mes');
    toast(old ? 'Promoted. The old first message is now in slot ' + (i + 1)
              : 'Promoted to first message', 3400);
  };

  const list = el('div','greetlist');
  greets.forEach((g, i) => {
    const gkey = 'alternate_greetings[' + i + ']';
    const it = el('div','listitem greet');
    it.dataset.gi = String(i);

    const bar = el('div','bar');
    if(greets.length > 1){
      const grip = el('button','grip');
      grip.type = 'button';
      grip.setAttribute('aria-label','Drag to reorder greeting ' + (i + 1));
      grip.title = 'Drag to reorder';
      grip.textContent = '⠿';
      bar.appendChild(grip);
    }
    bar.appendChild(el('span','idx','Slot ' + (i + 1) + '/' + greets.length));
    const gtok = el('span','tok');
    bar.appendChild(gtok);

    const def = el('button','minibtn promote','Default');
    def.title = 'Make this the card’s first message';
    def.onclick = () => promote(i);
    bar.appendChild(def);

    if(greets.length > 1){
      const up = el('button','minibtn','↑');
      up.setAttribute('aria-label','Move greeting ' + (i + 1) + ' up');
      up.disabled = i === 0;
      up.onclick = () => move(i, i - 1);
      const down = el('button','minibtn','↓');
      down.setAttribute('aria-label','Move greeting ' + (i + 1) + ' down');
      down.disabled = i === greets.length - 1;
      down.onclick = () => move(i, i + 1);
      bar.appendChild(up); bar.appendChild(down);
    }

    it.appendChild(bar);

    const label = 'Greeting ' + (i + 1);
    let acts = null;
    const sync = () => {
      const v = fieldRef(gkey).get();
      gtok.textContent = '~' + estTokens(v) + ' tok';
      prev.textContent = v || 'Empty — tap to write';
      prev.classList.toggle('placeholder', !v);
      if(acts && acts.refresh) acts.refresh();
    };
    const prev = textPreview(gkey, label, sync);
    it.appendChild(prev);
    acts = textActions(gkey, label, sync, {noRevert:true});
    const del = el('button','del','Remove');
    del.onclick = () => { greets.splice(i, 1); Hist.commit('remove greeting'); queueSave(); renderCard(); };
    acts.appendChild(del);
    it.appendChild(acts);
    sync();

    list.appendChild(it);
  });
  host.appendChild(list);
  if(greets.length > 1) makeDraggable(list, '.greet', '.grip', order => commitOrder(order, 'reorder greetings'));
  const addG = el('button','iconbtn','+ Add greeting');
  addG.onclick = () => { (d.alternate_greetings = d.alternate_greetings || []).push(''); Hist.commit('add greeting'); queueSave(); renderCard(); };
  const gRow = el('div','fieldbtns');
  gRow.appendChild(addG);
  const genG = el('button','iconbtn primary','✦  Generate a greeting');
  genG.disabled = !AI.ready;
  genG.title = AI.ready ? 'Write a new greeting with the model' : 'Add an OpenRouter key in Settings';
  genG.onclick = greetingSheet;
  gRow.appendChild(genG);
  host.appendChild(gRow);
}

function pickPortrait(imgEl){
  const inp = el('input'); inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = async () => {
    const f = inp.files[0]; if(!f) return;
    try{
      const bmp = await createImageBitmap(f);
      const W = 512, H = Math.round(W * bmp.height / bmp.width);
      const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
      cv.getContext('2d').drawImage(bmp, 0, 0, W, H);
      const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
      const u8 = new Uint8Array(await blob.arrayBuffer());
      CURRENT.png = u8; CURRENT.chunks = parseChunks(u8);
      CURRENT.portraitBlob = new Blob([u8], {type:'image/png'});
      imgEl.src = URL.createObjectURL(CURRENT.portraitBlob);
      if(CURRENT.gingerXml){
        toast('Portrait replaced. Recipe data was on the old image and is now gone.', 4200);
        CURRENT.gingerXml = null;
      } else toast('Portrait replaced');
      queueSave();
    }catch(e){ toast('Could not read that image: ' + e.message, 4000); }
  };
  inp.click();
}

function renderRecipes(){
  const host = $('v-rec'); host.innerHTML = '';
  const xml = CURRENT.gingerXml;
  if(!xml){
    host.appendChild(el('div','empty','This card has no recipe data.'));
    return;
  }
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  if(doc.querySelector('parsererror')){
    host.appendChild(el('div','note','The recipe data on this card could not be parsed.'));
    return;
  }
  const txtOf = (node, tag) => { const c = node.querySelector(':scope > ' + tag); return c ? c.textContent.trim() : ''; };
  const PARAM_TAGS = /^(Text|Number|Choice|Toggle|Multiple|List|Slider|Measurement)$/;

  /* A Ginger card stores recipes twice: the top-level <Recipes> holds the DEFINITIONS
     (labels, option lists), while <Character><Recipes> holds the INSTANCES — the actual
     values the user typed, as <Parameter id="...">value</Parameter>. Join the two. */
  const defs = new Map();          // recipe id -> {name, labels: Map(paramId -> label), opts: Map(paramId -> Map(optId -> text))}
  const defRoot = doc.querySelector(':scope > Recipes');
  for(const r of (defRoot ? Array.from(defRoot.children) : [])){
    const id = r.getAttribute('id'); if(!id || defs.has(id)) continue;
    const labels = new Map(), opts = new Map();
    for(const p of Array.from(r.children)){
      if(!PARAM_TAGS.test(p.tagName)) continue;
      const pid = p.getAttribute('id'); if(!pid) continue;
      labels.set(pid, txtOf(p,'Label') || pid);
      const os = p.querySelectorAll(':scope > Option');
      if(os.length){
        const m = new Map();
        os.forEach(o => m.set(o.getAttribute('id'), o.textContent.trim()));
        opts.set(pid, m);
      }
    }
    defs.set(id, {name: txtOf(r,'Title') || txtOf(r,'Name') || id,
                  category: txtOf(r,'Category'), labels, opts});
  }

  /* Instances are <Instance id="..." active="..."> under Character > Recipes. */
  let shown = Array.from(doc.querySelectorAll('Character > Recipes > Instance'));
  const fromInstances = shown.length > 0;
  if(!fromInstances && defRoot) shown = Array.from(defRoot.children);

  const n = el('div','note');
  n.innerHTML = '<b>Read-only.</b> These are the recipes and the values stored on this card. ' +
    'Everything here survives export untouched.';
  host.appendChild(n);

  const withValues = shown.filter(r => r.querySelector(':scope > Parameter')).length;
  host.appendChild(el('h2','sec',
    shown.length + ' recipes' + (fromInstances ? ' · ' + withValues + ' with values' : '')));

  for(const r of shown){
    const id = r.getAttribute('id') || '';
    const def = defs.get(id);
    const params = Array.from(r.querySelectorAll(':scope > Parameter'));
    const inactive = r.getAttribute('active') === 'false';

    const d = el('details','rec');
    let label = (def && def.name) || txtOf(r,'Title') || txtOf(r,'Name') || id || 'Recipe';
    if(id.startsWith('__')) label = label + ' (component)';
    if(inactive) label = label + ' — off';
    d.appendChild(el('summary', null, label + (params.length ? '  · ' + params.length : '')));

    const body = el('div','body');
    const dl = el('dl','kv');
    if(id){ dl.appendChild(el('dt',null,'id')); dl.appendChild(el('dd',null,id)); }
    if(def && def.category){ dl.appendChild(el('dt',null,'category')); dl.appendChild(el('dd',null,def.category)); }

    if(params.length){
      for(const p of params){
        const pid = p.getAttribute('id') || '';
        let val = p.textContent.trim();
        if(def && def.opts.has(pid) && def.opts.get(pid).has(val)) val = def.opts.get(pid).get(val);
        dl.appendChild(el('dt', null, (def && def.labels.get(pid)) || pid));
        dl.appendChild(el('dd', null, val || '—'));
      }
    } else {
      dl.appendChild(el('dt',null,'values'));
      dl.appendChild(el('dd',null,'this recipe takes no input'));
    }
    body.appendChild(dl);
    d.appendChild(body);
    host.appendChild(d);
  }
}
