/* Saving works in two homes: on GitHub Pages / a local file, an <a download> is
   correct. Inside the claude.ai artifact viewer, pages cannot download at all —
   the host mediates it through the downloads capability. Try that first, fall back. */
let DL = undefined;
async function downloadsAPI(){
  if(DL !== undefined) return DL;
  try{ DL = (window.claude && claude.use) ? await claude.use('downloads') : null; }
  catch(e){ DL = null; }
  return DL;
}
const DL_MSG = {
  declined:      null,                                     // viewer said no; stay quiet
  too_large:     'That card is over the 16 MB save limit.',
  rate_limited:  'A save prompt is already open. Try again in a moment.',
  unavailable:   'Saving is not available in this view. Open the app on your own site to export.',
  bad_request:   'Could not prepare that file.'
};

async function doExport(kind, how){
  const rec = CURRENT;
  const safe = (rec.data.name || 'character').replace(/[^\w\- ]+/g,'').trim() || 'character';
  let blob, filename;
  try{
    if(kind === 'json'){
      blob = new Blob([JSON.stringify(cardToJSON(rec), null, 2)], {type:'application/json'});
      filename = safe + '.json';
    }else{
      blob = new Blob([exportPNG(rec)], {type:'image/png'});
      filename = safe + '.png';
    }
  }catch(e){ toast('Export failed: ' + e.message, 4200); return; }

  if(how === 'share'){
    const file = new File([blob], filename, {type:blob.type});
    try{
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:rec.data.name || 'Character card'});
        return;
      }
    }catch(e){ if(e && e.name === 'AbortError') return; }
    toast('Sharing is not available here — use Save instead.', 3600);
    return;
  }

  const dl = await downloadsAPI();
  if(dl){
    try{
      await dl.save({filename, data:blob});
      toast('Saved ' + filename);
    }catch(e){
      const m = DL_MSG.hasOwnProperty(e && e.code) ? DL_MSG[e.code]
              : ('Save failed: ' + ((e && e.message) || 'unknown error'));
      if(m) toast(m, 4200);
    }
    return;
  }

  const url = URL.createObjectURL(blob);
  const a = el('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast('Saved ' + filename);
}

/* ============================ sheets ============================ */
function openSheet(build){
  const sh = $('sheet'); sh.innerHTML = ''; build(sh);
  $('scrim').hidden = false;
}
function closeSheet(){ $('scrim').hidden = true; }
$('scrim').onclick = e => { if(e.target === $('scrim')) closeSheet(); };

function aiSheet(key, label, task, backToEditor){
  const rec = CURRENT;
  const ref = fieldRef(key);
  const before = ref.get();
  const back = () => { if(backToEditor) editorSheet(key, label); else closeSheet(); };
  if(!before.trim()){ toast('Nothing to work with — write something first.'); return; }

  openSheet(sh => {
    const head = el('div','sheethead');
    head.appendChild(el('h3', null, AI_TASKS[task].label + ' · ' + label));
    const pb = el('button','minibtn prompt','Prompt');
    if(Prompts.customised(fieldRef(key).promptKey)) pb.classList.add('on');
    pb.title = 'Edit the instruction being sent';
    pb.onclick = () => promptSheet(fieldRef(key).promptKey, label, backToEditor);
    head.appendChild(pb);
    sh.appendChild(head);

    const status = el('p','desc');
    status.innerHTML = '<span class="spin"></span> Asking ' + AI.model + '…';
    sh.appendChild(status);

    const diff = el('div','diff');
    const b1 = el('div','diffbox');
    b1.appendChild(el('div','cap','Current'));
    b1.appendChild(el('div','txt', before));
    diff.appendChild(b1);
    sh.appendChild(diff);

    runAI(rec, key, label, task, before).then(after => {
      status.textContent = 'Review the proposed text. Nothing changes until you accept it.';
      const b2 = el('div','diffbox new');
      b2.appendChild(el('div','cap','Proposed · ~' + estTokens(after) + ' tok'));
      b2.appendChild(el('div','txt', after));
      diff.appendChild(b2);

      const btns = el('div','sheetbtns');
      const no = el('button','iconbtn','Discard');
      no.onclick = back;
      const yes = el('button','iconbtn primary','Accept');
      yes.onclick = () => {
        ref.set(after);
        Hist.commit(AI_TASKS[task].label.toLowerCase() + ' ' + label.toLowerCase());
        queueSave(); syncField(key); back();
        toast('Applied to ' + label + ' — undo with ↶');
      };
      btns.appendChild(no); btns.appendChild(yes);
      sh.appendChild(btns);
    }).catch(err => {
      status.textContent = err.message;
      status.style.color = 'var(--danger)';
      const btns = el('div','sheetbtns');
      const ok = el('button','iconbtn','Close'); ok.onclick = back;
      btns.appendChild(ok); sh.appendChild(btns);
    });
  });
}

/* ============================ wiring ============================ */
let saveTimer;
function queueSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    if(!CURRENT) return;
    try{ await saveCard(CURRENT); }
    catch(e){ toast('Could not save to the library: ' + e.message, 4200); }
  }, 500);
}

$('back').onclick = () => { if(Hist.pending) Hist.commit(Hist.pending); showLibrary(); };
$('settingsBtn').onclick = settingsSheet;
$('importBtn').onclick = () => $('fileIn').click();
$('undoBtn').onclick = () => Hist.go(-1);
$('redoBtn').onclick = () => Hist.go(1);
$('newBtn').onclick = async () => {
  try{
    const rec = await newCard();
    showCard(rec);
    conceptSheet();
  }catch(e){ toast('Could not create a card: ' + e.message, 4000); }
};
for(const b of document.querySelectorAll('.tab')) b.onclick = () => selectTab(b.dataset.tab);

document.addEventListener('keydown', e => {
  if(!CURRENT || !(e.ctrlKey || e.metaKey)) return;
  const k = e.key.toLowerCase();
  if(k === 'z' && !e.shiftKey){ e.preventDefault(); Hist.go(-1); }
  else if((k === 'z' && e.shiftKey) || k === 'y'){ e.preventDefault(); Hist.go(1); }
});

$('fileIn').onchange = async e => {
  const files = Array.from(e.target.files || []);
  e.target.value = '';
  if(!files.length) return;
  let ok = 0, last = null, fails = [];
  for(const f of files){
    try{ const rec = await readCardFile(f); await saveCard(rec); last = rec; ok++; }
    catch(err){ fails.push(f.name + ' — ' + err.message); }
  }
  if(ok) toast('Imported ' + ok + ' card' + (ok === 1 ? '' : 's'));
  if(fails.length) toast(fails[0], 5000);
  if(ok === 1 && last) showCard(last); else showLibrary();
};

window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', async e => {
  e.preventDefault();
  const files = Array.from(e.dataTransfer.files || []);
  if(!files.length) return;
  let ok = 0, last = null;
  for(const f of files){ try{ const r = await readCardFile(f); await saveCard(r); last = r; ok++; }catch(err){} }
  if(ok){ toast('Imported ' + ok + ' card' + (ok === 1 ? '' : 's')); if(ok === 1) showCard(last); else showLibrary(); }
  else toast('Nothing importable in that drop', 3200);
});

if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

/* ---------- installable app ----------
   Only meaningful on the real deploy; inside the artifact viewer the service
   worker and the install prompt are both unavailable, so every branch is optional. */
const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

if('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const sw = reg.installing;
      if(!sw) return;
      sw.addEventListener('statechange', () => {
        // A new version is ready and an old one is still driving the page.
        if(sw.state === 'installed' && navigator.serviceWorker.controller)
          toast('Update ready — reopen the app to use it', 5000);
      });
    });
  }).catch(() => {});
}

let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstall = e;
  if(!standalone) $('installBtn').hidden = false;
});
window.addEventListener('appinstalled', () => {
  deferredInstall = null;
  $('installBtn').hidden = true;
  toast('Installed — open it from your home screen', 3600);
});
$('installBtn').onclick = async () => {
  if(!deferredInstall) return;
  deferredInstall.prompt();
  try{ await deferredInstall.userChoice; }catch(e){}
  deferredInstall = null;
  $('installBtn').hidden = true;
};

/* iOS never fires beforeinstallprompt — Safari installs only through Share > Add to
   Home Screen, so the only thing that helps there is saying so, once. */
(function iosHint(){
  if(standalone) return;
  const ua = navigator.userAgent;
  const iOS = /iPad|iPhone|iPod/.test(ua) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const safari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
  if(!iOS || !safari) return;
  try{ if(localStorage.getItem('gcs-ios-hint') === 'seen') return; }catch(e){}
  setTimeout(() => {
    openSheet(sh => {
      sh.appendChild(el('h3', null, 'Add to your home screen'));
      sh.appendChild(el('p','desc',
        'Cardcraft runs as a full app on iOS, offline and without Safari’s toolbars. ' +
        'Tap the Share button at the bottom of Safari, then choose “Add to Home Screen”.'));
      const btns = el('div','sheetbtns');
      const ok = el('button','iconbtn primary','Got it');
      ok.onclick = () => { try{ localStorage.setItem('gcs-ios-hint','seen'); }catch(e){} closeSheet(); };
      btns.appendChild(ok);
      sh.appendChild(btns);
    });
  }, 1400);
})();

showLibrary();
